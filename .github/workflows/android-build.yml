name: Android Build (APK + AAB)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK, release APK and release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret set - the release build will be unsigned."
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a build.log

      - name: Build release APK and AAB
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee -a build.log

      - name: Run Android Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintRelease 2>&1 | tee -a build.log


      - name: Report build failure
        if: failure()
        run: |
          python3 - <<'PY'
          try:
              lines = open('build.log', errors='replace').read().splitlines()
          except OSError:
              lines = ['build.log not found']
          keep = [l for l in lines if l.strip()][-150:]
          msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in keep)
          print('::error title=Gradle build failed::' + msg)
          PY

      - name: Show lint findings
        if: always()
        run: |
          report=app/build/reports/lint-results-release.txt
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "No lint text report produced."
          fi

      - name: Verify release artifact metadata
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          echo "--- release APK badging ---"
          "$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | \
            grep -E "package:|sdkVersion|targetSdkVersion|uses-permission|application-label|launchable-activity" || true
          echo "--- AAB contents ---"
          unzip -l app/build/outputs/bundle/release/app-release.aab | tail -5

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build outputs"
            echo ""
            find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '- `%p` (%s bytes)\n' 2>/dev/null || true
            echo ""
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
              echo "Release artifacts are signed with the upload key from repository secrets."
            else
              echo "> The release AAB is **unsigned**. Add the \`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` and \`KEY_PASSWORD\` secrets to produce a Play-ready signed bundle."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB (Play Console upload)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload ProGuard/R8 mapping
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: warn
