name: Build APK AAB v1.0
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      
      - name: Fix gradlew permission & wrapper
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.7
          chmod +x gradlew
          
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace
        
      - uses: actions/upload-artifact@v4
        with: { name: apk-debug-v1, path: app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        with: { name: aab-release-v1, path: app/build/outputs/bundle/release/app-release.aab }
