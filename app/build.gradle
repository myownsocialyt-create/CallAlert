plugins {
    id 'com.android.application'
}

android {
    namespace 'com.datashield.vehiclecallalert'
    compileSdk 34  // Use 34 for stable build, target still 36 for Play Console

    defaultConfig {
        applicationId "com.datashield.vehiclecallalert"
        minSdk 21
        targetSdk 36  // Play Console requires 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('vehicle-call-alert.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "vehiclecallalert"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Will use unsigned if no keystore secrets, signed if secrets present
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'  // FIXED: was 1.11.0 not found
    implementation 'androidx.webkit:webkit:1.8.0'
}
